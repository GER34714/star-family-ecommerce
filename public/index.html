<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tienda Online">
    <meta name="application-name" content="Tienda Online">
    <meta name="theme-color" content="#C41E3A">
    <meta name="description" content="Distribuidor Mayorista de Alimentos Premium - Compra online con delivery">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self' https://star-family-backend.onrender.com https://api.mercadopago.com https://bedccnjylrnkacaxtusv.supabase.co https://http2.mlstatic.com https://www.mercadolibre.com https://api.mercadolibre.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.mercadopago.com https://http2.mlstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://http2.mlstatic.com; frame-src 'self' https://www.mercadolibre.com;">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://iili.io/B6XgSSI.jpg">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>
    
    <script>
        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registrado exitosamente:', registration);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New content is available
                                    if (confirm('Nueva versión disponible. ¿Actualizar ahora?')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.log('Error registrando SW:', error);
                    });
            });
        }

        // Detectar si es PWA instalada
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevenir el banner automático de instalación
            e.preventDefault();
            
            // Guardar el evento para mostrarlo manualmente
            window.deferredPrompt = e;
            
            // Mostrar botón de instalación personalizado (opcional)
            console.log('PWA installation prompt available');
        });
    </script>
</body>
</html>
